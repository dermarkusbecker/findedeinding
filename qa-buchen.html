<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Q&A Gespräch buchen · Finde dein Ding</title>
  <style>
    :root{font-family:Inter,Arial,sans-serif;color:#12333c;background:#071f2c}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 80% 0,#184b57,#071f2c 58%);padding:20px}main{max-width:760px;margin:5vh auto;background:#fff;border-radius:24px;box-shadow:0 24px 80px #0005;overflow:hidden}.head{padding:30px 34px;background:linear-gradient(115deg,#0a3442,#123c43 60%,#59493d);color:#fff}.head img{width:190px;max-height:54px;object-fit:contain;object-position:left}.head small{display:block;margin-top:24px;color:#ff9b5b;font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase}.head h1{margin:8px 0;font-size:clamp(26px,5vw,36px)}.head p{margin:0;color:#d4e6e5;line-height:1.5}.body{padding:28px 34px 36px}.note{color:#506a71;font-size:14px;line-height:1.5}.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:10px;margin:18px 0 24px}.slot{border:1px solid #c9dbd9;background:#f2f8f7;color:#103c43;padding:12px;border-radius:10px;text-align:left;cursor:pointer}.slot:hover,.slot.selected{border-color:#0b9882;background:#ddf5ee}.slot strong,.slot small{display:block}.slot small{margin-top:3px;color:#577077}.fields{display:grid;grid-template-columns:1fr 1fr;gap:14px}.fields label{font-size:13px;font-weight:700}.fields input{display:block;width:100%;margin-top:6px;border:1px solid #c7d8db;border-radius:9px;padding:12px;font:inherit}.fields label:first-child{grid-column:1/-1}button.primary{margin-top:20px;background:#ff9654;border:0;border-radius:10px;padding:14px 22px;color:#112f36;font-weight:800;font:inherit;cursor:pointer}button.primary:disabled{opacity:.55;cursor:not-allowed}#message{margin:18px 0;color:#116d5c;line-height:1.5}a{color:#0b8874}@media(max-width:580px){body{padding:8px}.head,.body{padding:22px}.fields{grid-template-columns:1fr}.slots{grid-template-columns:repeat(2,minmax(0,1fr))}}
  </style>
</head>
<body><main><div class="head"><img src="/assets/fdd-logo.svg" alt="Finde dein Ding"><small>Persönlicher Austausch</small><h1 id="title">Q&A Gespräch buchen</h1><p>Wähle einen freien Termin. Nach der Buchung erhältst du den Google-Meet-Link per E-Mail.</p></div><div class="body"><p class="note">Alle Zeiten gelten für Deutschland (Europe/Berlin). Dieses Gespräch gehört nicht zur Intake-Anmeldung.</p><div id="message" role="status" aria-live="polite">Freie Termine werden geladen …</div><div id="slots" class="slots"></div><form id="form" hidden><div class="fields"><label>Name<input name="name" autocomplete="name" required maxlength="120"></label><label>E-Mail<input name="email" type="email" autocomplete="email" required maxlength="254"></label><label>Telefon (optional)<input name="phone" type="tel" autocomplete="tel" maxlength="40"></label></div><input name="website" tabindex="-1" autocomplete="off" style="position:absolute;left:-9999px"><button class="primary" type="submit">Q&A Gespräch verbindlich buchen →</button></form></div></main><script type="module" src="/qa-buchen.js"></script></body>
</html>
